steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/election-education-promptwars', '.']
  
  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/election-education-promptwars']
  
  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'election-education-promptwars'
      - '--image'
      - 'gcr.io/$PROJECT_ID/election-education-promptwars'
      - '--region'
      - 'asia-south1'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--set-env-vars'
      - 'CACHE_TTL_HOURS=6,RESULT_REFRESH_MINUTES=5,COUNTING_DATE=May 4, 2026 08:00:00'

images:
  - 'gcr.io/$PROJECT_ID/election-education-promptwars'
